name: Keep Render awake until 21 November 2026

on:
  schedule:
    # GitHub Actions schedules use UTC. Ten minutes is safely below
    # Render's fifteen-minute inactivity timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          deadline=$(date -u -d "2026-11-21 22:59:59" +%s)
          now=$(date -u +%s)

          if (( now > deadline )); then
            echo "Keep-awake period finished; skipping request."
            exit 0
          fi

          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 10 \
            --max-time 120 \
            https://tfg-escape-room.onrender.com/health
